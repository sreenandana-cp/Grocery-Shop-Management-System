<!DOCTYPE html>
{% extends 'dashboard.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Our Products</h4>

                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th>Category Name</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Description</th>
                            <th>Image</th>
                            <th>Options</th>
                          </tr>
                        </thead>
                            <tbody>
                        {% for d in products %}
                            <tr>
                            <td>{{ d.Category_Name }}</td>
                            <td>{{ d.ProductName }}</td>
                            <td>{{ d.Price }}</td>
                            <td>{{ d.Description }}</td>
                            <td>
                                <img src="{{ d.ProductImage.url }}">
                            </td>
                            <td>
                                <a href="{% url 'product_edit' pro_id=d.id %}" class="btn btn-outline-primary">Edit</a>
                                <a href="{% url 'delete_product' pro_id=d.id %}" class="btn btn-outline-success">Delete</a>
                            </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
</body>
</html>
{% endblock %}
